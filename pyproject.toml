[project]
name = "gb-balancing-lakehouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Calum", email = "your@email.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deltalake>=1.6.6",
    "httpx>=0.28.1",
    "polars>=2.0.0",
